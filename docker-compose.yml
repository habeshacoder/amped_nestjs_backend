version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: amped_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-amped_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: amped_app
    restart: unless-stopped
    ports:
      - '3007:3007'
    environment:
      - NODE_ENV=development
      - PORT=3007
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-amped_db}?schema=public
      - JWT_SECRET=${JWT_SECRET:-supersecrettestjwtkey1234567890}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-supersecrettestjwtrefreshkey1234567890}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "dist/main"]

volumes:
  postgres_data:
    driver: local
