version: '3.8'

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: amped_postgres_test
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: amped_test
    ports:
      - '5432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d amped_test']
      interval: 2s
      timeout: 3s
      retries: 10
